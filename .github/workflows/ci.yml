name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Install the runtime deps the test suite needs. (The heavy voice stack —
      # pipecat/torch — isn't imported by the tests, so we skip it here to keep
      # CI fast; voice/bot.py imports pipecat lazily inside run_bot().)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "SQLAlchemy>=2.0" "pydantic>=2.6" "pydantic-settings>=2.2" \
            "phonenumbers>=8.13" "fastapi>=0.110" "httpx>=0.27" "twilio>=9.0" \
            "python-multipart>=0.0.9" "typer>=0.12" "rich>=13.7" \
            "pytest>=8.0" "pytest-asyncio>=0.23"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
