[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldy"
version = "0.1.0"
description = "Coldy — a human-sounding, compliance-first AI cold-calling platform for US service businesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Launch Media" }]

dependencies = [
    # --- Real-time voice pipeline (the brain + ears + mouth) ---
    # Pipecat orchestrates STT -> LLM -> TTS with VAD/interruptions over a
    # Twilio Media Streams websocket. Extras pull in each provider integration.
    "pipecat-ai[anthropic,deepgram,cartesia,silero,twilio]>=0.0.60",
    "anthropic>=0.40",

    # --- Telephony ---
    "twilio>=9.0",

    # --- API / server ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",

    # --- Data ---
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # --- Phone number / timezone handling for compliance ---
    "phonenumbers>=8.13",

    # --- CLI + utilities ---
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "freezegun>=1.4",
]

[project.scripts]
coldy = "coldy.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
