# Production stack for a single DigitalOcean Droplet:
#   caddy  — TLS termination (auto Let's Encrypt) + reverse proxy (incl. WSS)
#   api    — coldy serve (webhooks, media-stream websocket, dashboard, opt-in)
#   dialer — coldy run (the pacing worker; calls only consented leads)
#   db     — Postgres
#
#   cp .env.example .env  &&  edit .env   (set COLDY_DOMAIN, keys, secrets)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COLDY_DOMAIN: ${COLDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: coldy serve
    env_file: .env
    environment:
      COLDY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COLDY_HOST: 0.0.0.0
      COLDY_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  dialer:
    build: .
    restart: unless-stopped
    command: sh -c 'coldy run --campaign "$${CAMPAIGN}"'
    env_file: .env
    environment:
      COLDY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
